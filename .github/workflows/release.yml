name: Release

# Merging a PR into main is the release. Nothing to remember, nothing to run
# by hand: the job versions itself from the last tag, publishes, and tags.
on:
  push:
    branches: [main]

permissions:
  contents: write   # push the release tag
  id-token: write    # npm provenance, and trusted publishing if you use it

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Never publish from an untrusted fork: only the maintainer's own merges.
    if: github.repository == 'lucaspdude/simple-llm-guards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version comes from the previous tag.
          fetch-depth: 0
          # Lets the release tag trigger a fresh build of the published code.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url here on purpose: setup-node would write an
          # _authToken=${NODE_AUTH_TOKEN} line, and with no token set npm would
          # send that literal placeholder and break the OIDC path below.

      # Two ways in, picked at run time:
      #   NPM_TOKEN set   -> granular token auth
      #   NPM_TOKEN unset -> npm trusted publishing, authenticated by this
      #                      workflow's identity through OIDC
      - name: Authenticate with npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
            echo "using NPM_TOKEN"
          else
            rm -f ~/.npmrc
            echo "no NPM_TOKEN - falling back to trusted publishing"
          fi

      - run: npm ci

      - name: Tests must pass before anything is published
        run: npm test

      - name: Work out the version to publish
        id: version
        run: |
          if NEXT=$(node scripts/release.mjs); then
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            echo "publishing $NEXT"
          else
            echo "no user-facing commits since the last tag — nothing to publish"
          fi

      - name: Bump, tag and publish
        if: steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          # Rewrites package.json in the workspace only. main is never touched:
          # the next run reads the version from this tag, not from the manifest.
          # --allow-same-version matters on the very first release, where the
          # computed version is exactly what package.json already declares.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish FIRST, tag second. A tag is the signal that a version is
          # out; tagging before the upload would make the next run skip past a
          # version that never shipped.
          # --provenance links the published tarball to this exact commit.
          npm publish --provenance --access public

          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: GitHub release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.next }}
        # --generate-notes works out the previous tag on its own.
        run: gh release create "$TAG" --generate-notes --title "$TAG"