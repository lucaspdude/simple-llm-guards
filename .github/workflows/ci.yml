name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Zero dependencies today, but the lockfile makes that a decision rather
      # than an accident.
      - run: npm ci
      - run: npm test

      # A PR that would ship a broken package fails here, before it is merged.
      - run: npm pack --dry-run
        if: matrix.node == '24'